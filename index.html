<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lanternfall">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Lanternfall</title>
<style>
:root{--panel:#16131c;--edge:#2c2536;--gold:#e8c26a;--txt:#ece4d2;--dim:#9a90a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
#view{position:relative;flex:1;min-height:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
/* --- overlay HUD --- */
#hud{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;width:60%;max-width:330px}
#menuBtn{pointer-events:auto;flex:none;width:38px;height:38px;border-radius:10px;background:#000a;border:1px solid #ffffff26;font-size:18px;display:flex;align-items:center;justify-content:center}
#stats{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.bar{position:relative;height:13px;background:#000b;border:1px solid #ffffff22;border-radius:4px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:50%;transition:width .2s}
.bar span{position:relative;display:block;padding-left:5px;font-size:10px;line-height:12px;text-shadow:0 1px 1px #000}
.bar.hp i{background:linear-gradient(#e0574b,#8f1f18)}.bar.mp i{background:linear-gradient(#5b8cf0,#22408e)}
.bar.xp{height:4px;border:none;background:#0008}.bar.xp i{background:var(--gold)}
#sub{font-size:10px;color:#ddd;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub b{color:var(--gold);font-weight:normal}
#mini{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:10px;width:24vmin;max-width:120px;height:auto;opacity:.9;border:1px solid #ffffff2a;border-radius:50%;background:#000a;image-rendering:pixelated;z-index:2}
#mini.big{width:min(88vw,80vh);max-width:none;top:50%;right:50%;transform:translate(50%,-50%);opacity:.95;border-radius:8px}
#msgs{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 74px);width:62%;max-width:380px;font-size:12px;line-height:15px;pointer-events:none;text-shadow:0 1px 2px #000,0 0 6px #000}
#msgs div{transition:opacity 1.4s;margin-bottom:2px}#msgs div.old{opacity:0}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash.go{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;top:44%;transform:translateX(-50%);font-weight:bold;font-size:20px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:rise .9s ease-out forwards}
@keyframes rise{0%{margin-top:0;opacity:1;font-size:24px}100%{margin-top:-60px;opacity:0}}
#toast{position:absolute;left:50%;top:32%;transform:translateX(-50%);font-size:18px;color:var(--gold);text-shadow:0 2px 0 #000,0 0 10px #000;pointer-events:none;opacity:0;white-space:nowrap;text-align:center}
#toast.go{animation:toast 2.4s ease-out}
@keyframes toast{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff6;pointer-events:none}
/* --- controls --- */
#ctrl{position:relative;flex:none;height:calc(220px + env(safe-area-inset-bottom));background:linear-gradient(#0b0a0f,#050407);border-top:1px solid #1d1824}
#stickRest,#stickBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #ffffff22;background:radial-gradient(#ffffff10,#ffffff04);pointer-events:none}
#stickBase{display:none;border-color:#ffffff40}
#knob,#restKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5a4f68,#2a2333);border:1px solid #ffffff40;box-shadow:0 3px 10px #000}
#restKnob{opacity:.6}
#lookHint{position:absolute;font-size:10px;color:#ffffff40;pointer-events:none;text-align:center}
#acts{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:200px;height:200px;pointer-events:none}
.rb{position:absolute;pointer-events:auto;border-radius:50%;width:52px;height:52px;background:#1d1824dd;border:1px solid #ffffff2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;padding:0;touch-action:none;box-shadow:0 3px 10px #0008}
.rb small{font-size:9px;color:#cfc6d8;margin-top:-1px}
.rb.on{transform:scale(.92);background:#3a3146}
.rb.off{opacity:.45}
#bStrike{width:86px;height:86px;right:0;bottom:0;font-size:30px;background:radial-gradient(#4a2219,#200d0a);border-color:#a0503e}
#bStrike small{font-size:10px}
#bBolt{right:125px;bottom:17px}#bMend{right:110px;bottom:71px}#bPot{right:71px;bottom:110px}#bEth{right:17px;bottom:125px}
@media (orientation:landscape) and (max-height:560px){
  #ctrl{position:absolute;inset:0;height:auto;background:none;border:none;pointer-events:none}
  #msgs{width:40%}
  #mini{width:22vmin}
}
/* --- screens & modals --- */
.screen,#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(#1a1422,#050407);z-index:10;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);overflow:auto;touch-action:pan-y}
#modal{background:#000b;z-index:20}
.show{display:flex!important}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:16px;box-shadow:0 10px 40px #000;max-height:100%;overflow:auto}
.card h2{margin:0 0 8px;color:var(--gold);font-size:18px;letter-spacing:1px}
.card p{margin:6px 0;font-size:13px;line-height:1.45;color:#cfc6d8}
.btn{display:block;width:100%;margin-top:8px;padding:12px;border-radius:9px;border:1px solid #4a3f58;background:linear-gradient(#2b2435,#1c1723);font-size:15px;cursor:pointer}
.btn.pri{border-color:#9b7a35;background:linear-gradient(#4a3a1c,#2a200e);color:#ffe6a8}
.btn.bad{border-color:#7a2e2e;color:#ffb3a8}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}.row .btn{flex:1}
h1{font-size:34px;letter-spacing:4px;margin:0;color:var(--gold);text-align:center;text-shadow:0 0 18px #e8c26a55}
.sub{text-align:center;color:var(--dim);font-size:12px;margin:4px 0 14px}
.slot{border:1px solid var(--edge);border-radius:10px;padding:10px;margin-top:10px;background:#0f0d13}
.slot .t{font-size:14px}.slot .m{font-size:11px;color:var(--dim);margin-top:3px}
.cls{border:1px solid var(--edge);border-radius:10px;padding:10px;margin-top:8px;cursor:pointer;background:#0f0d13}
.cls.sel{border-color:var(--gold);background:#221b10}
.cls b{color:var(--gold)}.cls div{font-size:12px;color:#cfc6d8;margin-top:3px}
input{width:100%;padding:11px;border-radius:8px;border:1px solid #4a3f58;background:#0b0a0f;color:var(--txt);font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed #2c2536}
.stat span:last-child{color:var(--gold)}
.shop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.shop .btn{width:auto;margin:0;padding:8px 12px;font-size:13px}
.journal{font-size:12px;line-height:1.5;color:#cfc6d8;max-height:50vh;overflow:auto}
</style>
</head>
<body>
<div id="game">
  <div id="view">
    <canvas id="c"></canvas>
    <div id="cross"></div>
    <div id="hud">
      <button id="menuBtn">☰</button>
      <div id="stats">
        <div class="bar hp"><i id="bHp"></i><span id="tHp"></span></div>
        <div class="bar mp"><i id="bMp"></i><span id="tMp"></span></div>
        <div class="bar xp"><i id="bXp"></i></div>
        <div id="sub"></div>
      </div>
    </div>
    <canvas id="mini"></canvas>
    <div id="msgs"></div>
    <div id="flash"></div>
    <div id="floats"></div>
    <div id="toast"></div>
  </div>
  <div id="ctrl">
    <div id="stickRest"><div id="restKnob"></div></div>
    <div id="stickBase"><div id="knob"></div></div>
    <div id="lookHint">drag to look</div>
    <div id="acts">
      <button class="rb" id="bStrike" data-a="atk">⚔<small id="lStrike">Strike</small></button>
      <button class="rb" id="bBolt" data-a="bolt">🔥<small>4</small></button>
      <button class="rb" id="bMend" data-a="mend">✚<small>5</small></button>
      <button class="rb" id="bPot" data-a="potion">🧪<small id="nPot">0</small></button>
      <button class="rb" id="bEth" data-a="ether">💧<small id="nEth">0</small></button>
    </div>
  </div>
</div>

<div id="title" class="screen"><div class="card" id="titleCard"></div></div>
<div id="modal"><div class="card" id="modalCard"></div></div>

<script>
'use strict';
// ================== CORE CONSTANTS ==================
const TEX = 32;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const SAVE_PREFIX = 'lanternfall_slot_', META_KEY = 'lanternfall_meta', SLOTS = 3, SAVE_VERSION = 2;
const $ = id => document.getElementById(id);
const cv = $('c');
const ctx = cv.getContext('2d');
const mini = $('mini'), mctx = mini.getContext('2d');
// Render buffer is sized to the view's shape (see resize()).
let W = 240, H = 320, SCALE = 200, PLANE = .6, img = null, buf = null, zbuf = null;
function resize() {
  const r = $('view').getBoundingClientRect();
  if (!r.width || !r.height) return;
  const asp = r.width / r.height;
  W = Math.max(120, Math.min(480, Math.round(Math.sqrt(80000 * asp))));
  H = Math.max(120, Math.min(480, Math.round(W / asp)));
  cv.width = W; cv.height = H;
  img = ctx.createImageData(W, H); buf = new Uint32Array(img.data.buffer); zbuf = new Float32Array(W);
  PLANE = Math.max(.45, Math.min(.9, .7 * Math.sqrt(asp)));
  SCALE = (W / 2) / PLANE;
  placeStickRest();
}

const RGB = (r, g, b) => (0xff000000 | (b << 16) | (g << 8) | r) >>> 0;
const cl = v => v < 0 ? 0 : v > 255 ? 255 : v | 0;
const C = (r, g, b) => RGB(cl(r), cl(g), cl(b));

const pick = a => a[Math.floor(Math.random() * a.length)];
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ================== GAME DATA ==================
const CLASSES = {
  sellsword: { name: 'Sellsword', desc: 'Heavy steel, thick hide. Hits hard and shrugs off blows. Easiest start.', hp: 34, mp: 6, atk: 6, mag: 1, def: 3, crit: .06, dodge: .05,

};

const TIERS = [
  { name: 'The Ossuary', wall: [150, 118, 86], mortar: [58, 46, 36], floor: [92, 80, 68], ceil: [46, 38, 32], accent: 'moss', fog: [10, 8, 6] },
  { name: 'The Drowned Vaults', wall: [78, 98, 112], mortar: [30, 40, 48], floor: [58, 70, 76], ceil: [28, 36, 44], accent: 'crystal', fog: [3, 8, 13] },
  { name: 'The Ember Halls', wall: [62, 46, 48], mortar: [26, 16, 18], floor: [66, 46, 40], ceil: [30, 18, 18], accent: 'lava', fog: [16, 5, 2] },
  { name: 'The Pale Below', wall: [168, 164, 178], mortar: [78, 72, 92], floor: [108, 102, 122], ceil: [48, 42, 60], accent: 'rune', fog: [8, 6, 16] },
];
const PREFIX = ['Rusted', 'Iron', 'Etched', 'Grim', 'Moonlit', 'Bloodsilver', 'Starless', 'Hollowforged', 'Kingslayer'];
const WBASE = { sellsword: ['Blade', 'Axe', 'Mace', 'Greatsword'], ashbinder: ['Staff', 'Rod', 'Sceptre', 'Wand'], cutpurse: ['Knives', 'Dirk', 'Stiletto', 'Kris'] };
const ABASE = ['Jerkin', 'Mail', 'Cuirass', 'Cloak', 'Brigandine', 'Plate'];
const NAMES = ['Vesk', 'Maren', 'Oda', 'Thorne', 'Ilsa', 'Corvin', 'Bram', 'Sable', 'Wren', 'Holt', 'Isolde', 'Fenn'];
const tierOf = f => Math.floor((f - 1) / 4) % TIERS.length;
const xpNeed = l => 12 + l * l * 8;


// ================== SPRITES (16x16 pixel art) ==================
const PAL = { k: [15, 12, 15], w: [228, 222, 200], W: [150, 145, 135], r: [230, 40, 30], R: [120, 20, 20], g: [96, 196, 74], G: [40, 110, 40], b: [130, 85, 45], B: [80, 50, 25], D: [58, 34, 16],
  y: [255, 214, 70], o: [250, 130, 30], p: [112, 52, 144], P: [60, 26, 82], s: [222, 172, 132], c: [90, 225, 235], C: [30, 90, 150], a: [128, 134, 150], A: [66, 70, 84], m: [96, 20, 30], t: [210, 130, 130], h: [92, 88, 70], n: [235, 190, 50], v: [190, 120, 255] };
const SPR_SRC = {

  slime: ['', '', '', '', '', '......gggg......', '....gggggggg....', '...gggggggggg...', '..ggwkggggwkgg..', '..ggkkggggkkgg..', '.gggggggggggggg.', '.gggggmmmmggggg.', '.ggggggmmgggggg.', 'gggggggggggggggg', '.GGGGGGGGGGGGGG.', ''],
  wretch: ['.....wwwwww.....', '....wwwwwwww....', '....wkkwwkkw....', '....wkrwwkrw....', '....wwwkkwww....', '.....wkwkww.....', '......wwww......', '...wwwwwwwwww...', '..w..wkwwkw..w..', '..w..wwwwww..w..', '..W..wkwwkw..W..', '.....wwwwww.....', '......w..w......', '......w..w......', '.....ww..ww.....', '....www..www....'],
  cultist: ['......pppp......', '.....pppppp.....', '....pppppppp....', '....ppkkkkpp....', '....pkykkykp....', '....ppkkkkpp....', '...pppppppppp...', '..pppppPPppppp..', '..pp.ppPPppp.pp.', '..s..ppPPppp..s.', '.....ppPPppp....', '.....ppppppp....', '....ppppppppp...', '....ppppppppp...', '...ppppppppppp..', '...PPPPPPPPPPP..'],
  wisp: ['', '', '.......oo.......', '......oyyo......', '.....oyyyyo.....', '....oyywwyyo....', '...oyywwwwyyo...', '...oywkwwkwyo...', '...oywwwwwwyo...', '...oyywmmwyyo...', '....oyywwyyo....', '.....oyyyyo.....', '......oyyo......', '.......oo.......', '', ''],
  knight: ['.....aaaaaa.....', '....aaaaaaaa....', '....akkkkkka....', '....akrkkrka....', '....aaaaaaaa....', '.....aaaaaa.....', '..aaaaaaaaaaaa..', '.aaaAaaaaaaAaaa.', '.aa.aaaaaaaa.aa.', '.aa.aaAAAAaa.aa.', '.ss.aaaaaaaa.ss.', '.W..aaaaaaaa..W.', '.W..aaa..aaa..W.', '.W..aaa..aaa..W.', '....aaa..aaa....', '...AAAA..AAAA...'],
  chest: ['', '', '', '', '', '', '', '...DDDDDDDDDD...', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DDDDDnnDDDDD..', '..DbbbbnnbbbbD..', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DDDDDDDDDDDD..', ''],
  chestOpen: ['', '', '', '', '...DDDDDDDDDD...', '..DbbbbbbbbbbD..', '..DDDDDDDDDDDD..', '..DkkkkkkkkkkD..', '..DDDDDDDDDDDD..', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DDDDDDDDDDDD..', ''],
  stairs: ['', '', '', '', '.......c........', '......ccc.......', '.....ccccc......', '.......c........', '.......c........', '', '', '...cccccccccc...', '..ckkkkkkkkkkc..', '.ckkkkkkkkkkkkc.', '..ckkkkkkkkkkc..', '...cccccccccc...'],
  shrine: ['.......c........', '......cwc.......', '.......c........', '', '......ccc.......', '.....ccwcc......', '......ccc.......', '', '.....WWWWWW.....', '....WccccccW....', '....WWWWWWWW....', '......WWWW......', '......WWWW......', '......WWWW......', '....WWWWWWWW....', '...WWWWWWWWWW...'],
  peddler: ['.....hhhhhh.....', '....hhhhhhhh....', '...hhkkkkkkhh...', '...hkkykkykkh...', '...hkkkkkkkkh...', '...hhkkwwkkhh...', '....hhhhhhhh....', '..hhhhhhhhhhhh..', '.hhhhbbbbhhhhhy.', '.hhh.bnnb.hhhoyo', '.ss..bbbb..ss.y.', '....hhhhhhhh....', '....hhhhhhhh....', '...hhhhhhhhhh...', '...hhhhhhhhhh...', '..BBBB....BBBB..'],
  fire: ['', '', '', '', '', '......oooo......', '.....oyyyyo.....', '....oyywwyyo....', '....oywwwwyo....', '....oyywwyyo....', '.....oyyyyo.....', '......oooo......', '', '', '', ''],
  hex: ['', '', '', '', '', '......PPPP......', '.....PvvvvP.....', '....PvvwwvvP....', '....PvwwwwvP....', '....PvvwwvvP....', '.....PvvvvP.....', '......PPPP......', '', '', '', ''],
};
const SPR = {};
for (const k in SPR_SRC) {
  const s = new Uint32Array(256), rows = SPR_SRC[k];
  for (let y = 0; y < 16; y++) { const r = (rows[y] || '').padEnd(16, '.'); for (let x = 0; x < 16; x++) { const p = PAL[r[x]]; s[y * 16 + x] = p ? RGB(p[0], p[1], p[2]) : 0; } }
  SPR[k] = s;
}

// ================== TEXTURES ==================
let TX = null;
function makeTex(fn) { const px = new Uint32Array(TEX * TEX), em = new Uint8Array(TEX * TEX); for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) { const v = fn(x, y); if (Array.isArray(v)) { px[y * TEX + x] = v[0]; em[y * TEX + x] = 1; } else px[y * TEX + x] = v; } return { px, em }; }
function genTextures(tier, s) {
  const T = TIERS[tier];
  const brick = (x, y) => { const row = y >> 3, off = (row & 1) ? 8 : 0, col = (x + off) >> 4, bx = (x + off) & 15, by = y & 7, n = hash2(x, y, s) * 18 - 9;
    if (by === 0 || bx === 0) return { mortar: true, c: C(T.mortar[0] + n, T.mortar[1] + n, T.mortar[2] + n) };
    const bt = hash2(col, row, s + 7) * 30 - 15; let e = 0; if (by === 1 || bx === 1) e = 14; if (by === 7 || bx === 15) e = -14;
    return { c: C(T.wall[0] + bt + n + e, T.wall[1] + bt + n + e, T.wall[2] + bt + n + e) }; };

    if (s.e && s.e.t === 'enemy' && s.e.aware && tY < 7 && scrX > 0 && scrX < W && tY < zbuf[Math.floor(scrX)])
      bars.push({ x: scrX, y: Math.max(2, top - 5), w: Math.max(14, sh2 * .5), r: s.e.hp / s.e.maxHp, boss: ENEMIES[s.e.k].boss });
  }
  ctx.putImageData(img, 0, 0);
  for (const b of bars) {
    ctx.fillStyle = '#000a'; ctx.fillRect(b.x - b.w / 2 - 1, b.y - 1, b.w + 2, 4);
    ctx.fillStyle = b.boss ? '#e8c26a' : '#d33'; ctx.fillRect(b.x - b.w / 2, b.y, b.w * Math.max(0, b.r), 2);

}
function drawHand(now) {
  const kind = CLASSES[S.cls].hand, ph = G.swing > 0 ? Math.sin((1 - G.swing) * Math.PI) : 0, bob = Math.sin(G.walk) * 3;
  const s = Math.max(W / 320, H / 260), wide = W / H > 1.3, bx = W * (wide ? .66 : .78);
  ctx.save();
  ctx.translate(bx, H); ctx.scale(s, s);
  if (kind === 'staff') {
    ctx.translate(10 - ph * 40, 15 + bob - ph * 20 - G.cast * 18); ctx.rotate(-.18 - ph * .5);
    ctx.fillStyle = '#4a2e18'; ctx.fillRect(-4, -96, 8, 130); ctx.fillStyle = '#6b4424'; ctx.fillRect(-2, -96, 3, 130);
    ctx.fillStyle = '#2a1a0e'; ctx.fillRect(-7, -100, 14, 6);
    const pulse = .6 + Math.sin(now * .005) * .2 + G.cast * .8;
    const gr = ctx.createRadialGradient(0, -110, 1, 0, -110, 26 + G.cast * 20);
    gr.addColorStop(0, `rgba(255,200,90,${Math.min(1, pulse)})`); gr.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, -110, 26 + G.cast * 20, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd890'; ctx.beginPath(); ctx.arc(0, -110, 6, 0, 7); ctx.fill();
  } else {
    const long = kind === 'sword';
    ctx.translate(-ph * 80, 12 + bob - ph * 30); ctx.rotate(-.35 - ph * 1.1);
    const bl = long ? 92 : 50, bw = long ? 11 : 8;
    const g = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0); g.addColorStop(0, '#6d7180'); g.addColorStop(.5, '#e7e9f0'); g.addColorStop(1, '#5a5d6a');
    ctx.fillStyle = g; ctx.fillRect(-bw / 2, -bl - 10, bw, bl);
    ctx.beginPath(); ctx.moveTo(-bw / 2, -bl - 10); ctx.lineTo(0, -bl - 10 - bw * 1.4); ctx.lineTo(bw / 2, -bl - 10); ctx.fill();
    ctx.fillStyle = '#8a6a2a'; ctx.fillRect(long ? -18 : -12, -12, long ? 36 : 24, 6);
    ctx.fillStyle = '#3a2414'; ctx.fillRect(-4, -6, 8, 30);
    if (kind === 'dagger') {
      ctx.restore(); ctx.save(); ctx.translate(W * (wide ? .3 : .2), H); ctx.scale(s, s); ctx.translate(ph * 30, 22 + bob); ctx.rotate(.4);
      ctx.fillStyle = g; ctx.fillRect(-4, -52, 8, 40); ctx.fillStyle = '#8a6a2a'; ctx.fillRect(-10, -14, 20, 5); ctx.fillStyle = '#3a2414'; ctx.fillRect(-3, -9, 6, 26);
    }
  }
  ctx.restore();
}
function drawMini() {
  if (!S) return;
  const big = G.bigMap, s = big ? 6 : 7, R = 7;               // small map = radar of R tiles around you
  const cw = big ? S.w * s : (R * 2 + 1) * s;
  if (mini.width !== cw) { mini.width = cw; mini.height = big ? S.h * s : cw; }
  const ox = big ? 0 : cw / 2 - S.px * s, oy = big ? 0 : cw / 2 - S.py * s;
  mctx.clearRect(0, 0, mini.width, mini.height);
  const x0 = big ? 0 : Math.max(0, Math.floor(S.px) - R - 1), x1 = big ? S.w - 1 : Math.min(S.w - 1, Math.floor(S.px) + R + 1);
  const y0 = big ? 0 : Math.max(0, Math.floor(S.py) - R - 1), y1 = big ? S.h - 1 : Math.min(S.h - 1, Math.floor(S.py) + R + 1);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (!S.seen[idx(x, y)]) continue;
    mctx.fillStyle = S.map[idx(x, y)] ? '#7a6656' : '#2e2836'; mctx.fillRect(ox + x * s, oy + y * s, s, s);
  }
  for (const e of S.ents) {
    if (!S.seen[idx(Math.floor(e.x), Math.floor(e.y))]) continue;
    if (e.t === 'enemy' && !(dist(e.x, e.y, S.px, S.py) <= 6 && los(S.px, S.py, e.x, e.y))) continue;
    mctx.fillStyle = { stairs: '#5be1eb', chest: e.open ? '#6a5a3a' : '#e8c26a', shrine: '#4aa8ff', peddler: '#7f7', enemy: ENEMIES[e.k] && ENEMIES[e.k].boss ? '#ff0' : '#f44' }[e.t];
    mctx.fillRect(ox + e.x * s - s / 2, oy + e.y * s - s / 2, s, s);
  }
  const px = ox + S.px * s, py = oy + S.py * s, r = s * 1.1, a = S.ang;
  mctx.fillStyle = '#fff'; mctx.beginPath();
  mctx.moveTo(px + Math.cos(a) * r * 1.5, py + Math.sin(a) * r * 1.5);
  mctx.lineTo(px + Math.cos(a + 2.4) * r, py + Math.sin(a + 2.4) * r);
  mctx.lineTo(px + Math.cos(a - 2.4) * r, py + Math.sin(a - 2.4) * r); mctx.fill();
}

// ================== MAIN LOOP ==================
let miniT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - (G.last || now)) / 1000); G.last = now;
  if (!G.running || !S || !TX || !buf) return;
  if (!G.modal && !G.dead) {
    S.playMs += dt * 1000;
    update(dt);
    miniT += dt; if (miniT > .2) { miniT = 0; drawMini(); }
  }
  for (const c of G.corpses) c.life -= dt * 2.5; G.corpses = G.corpses.filter(c => c.life > 0);
  G.swing = Math.max(0, G.swing - dt * 4); G.cast = Math.max(0, G.cast - dt * 2.5);
  render(now);
}
requestAnimationFrame(frame);

// ================== INPUT ==================
// Left side: floating joystick to move/strafe. Anywhere else: drag to look.
const ptrs = new Map();
const STICK_R = 50;
function landscape() { return innerWidth > innerHeight && innerHeight <= 560; }
function placeStickRest() {
  const rest = $('stickRest'), hint = $('lookHint'), ctrl = $('ctrl').getBoundingClientRect();
  if (landscape()) { rest.style.left = '110px'; rest.style.top = (innerHeight - 100) + 'px'; hint.style.left = (innerWidth / 2 - 40) + 'px'; hint.style.top = (innerHeight - 24) + 'px'; }
  else { rest.style.left = Math.min(110, innerWidth * .26) + 'px'; rest.style.top = '110px'; hint.style.left = (innerWidth * .38) + 'px'; hint.style.top = '12px'; }
}
function isStickZone(x, y) {
  if (landscape()) return x < innerWidth * .4 && y > innerHeight * .3;
  const c = $('ctrl').getBoundingClientRect();
  return y >= c.top && x < innerWidth * .5;
}
function releaseInputs() {
  ptrs.clear(); G.stick.x = 0; G.stick.y = 0; G.keys = {};
  $('stickBase').style.display = 'none'; $('stickRest').style.display = '';
}
$('game').addEventListener('pointerdown', ev => {
  if (ev.target.closest('button,#mini')) return;
  if (!G.running || G.modal) return;
  ev.preventDefault();
  const stick = isStickZone(ev.clientX, ev.clientY) && ![...ptrs.values()].some(p => p.type === 'stick');
  const p = { type: stick ? 'stick' : 'look', sx: ev.clientX, sy: ev.clientY, lx: ev.clientX, ly: ev.clientY, t: performance.now() };
  ptrs.set(ev.pointerId, p);
  if (stick) {
    const b = $('stickBase'), host = $('ctrl').getBoundingClientRect();
    b.style.left = (ev.clientX - host.left) + 'px'; b.style.top = (ev.clientY - host.top) + 'px'; b.style.display = 'block'; $('stickRest').style.display = 'none';
    $('knob').style.transform = '';
  }
});
window.addEventListener('pointermove', ev => {
  const p = ptrs.get(ev.pointerId); if (!p) return;
  if (p.type === 'stick') {
    let dx = ev.clientX - p.sx, dy = ev.clientY - p.sy; const L = Math.hypot(dx, dy);
    if (L > STICK_R) { dx *= STICK_R / L; dy *= STICK_R / L; }
    $('knob').style.transform = `translate(${dx}px,${dy}px)`;
    const m = Math.min(1, L / STICK_R), dz = .15, k = m < dz ? 0 : (m - dz) / (1 - dz) / (m || 1);
    G.stick.x = dx / STICK_R * k; G.stick.y = dy / STICK_R * k;
  } else {
    const dx = ev.clientX - p.lx; p.lx = ev.clientX; p.ly = ev.clientY;
    if (S && G.running && !G.modal) S.ang += dx * .0085 * meta.look;
  }
});
function endPtr(ev) {
  const p = ptrs.get(ev.pointerId); if (!p) return; ptrs.delete(ev.pointerId);
  if (p.type === 'stick') { G.stick.x = 0; G.stick.y = 0; $('stickBase').style.display = 'none'; $('stickRest').style.display = ''; }
}
window.addEventListener('pointerup', endPtr); window.addEventListener('pointercancel', endPtr);

document.querySelectorAll('[data-a]').forEach(b => {
  const a = b.dataset.a; let t = null;
  b.addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); b.classList.add('on'); act(a); if (a === 'atk') t = setInterval(() => act(a), 120); });
  const up = () => { b.classList.remove('on'); clearInterval(t); t = null; };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => b.addEventListener(n, up));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
$('menuBtn').addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); act('menu'); });
mini.addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); act('map'); });

const HOLD = new Set(['w', 'a', 's', 'd', 'q', 'e', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
const PRESS = { ' ': 'atk', f: 'atk', '1': 'bolt', '2': 'mend', '3': 'potion', h: 'potion', '4': 'ether', m: 'map', Escape: 'menu' };
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (HOLD.has(k)) { e.preventDefault(); G.keys[k] = true; return; }
  const a = PRESS[k]; if (a) { e.preventDefault(); if (k === 'Escape' && G.modal) { closeModal(); return; } if (!e.repeat || a === 'atk') act(a); }
});
window.addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; delete G.keys[k]; });
window.addEventListener('blur', releaseInputs);
document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseInputs(); save(true); cloudFlush(); } });

window.addEventListener('resize', () => setTimeout(resize, 50));
document.addEventListener('gesturestart', e => e.preventDefault());

// ================== MENUS ==================
function openMenu() {

    { label: 'Resume', cls: 'pri', fn: () => { } },
    { label: 'Character', fn: openChar },
    { label: 'Journal', fn: () => modal('Journal', `<div class="journal">${S.log.slice().reverse().map(m => `<div>${m}</div>`).join('')}</div>`, [{ label: 'Back', cls: 'pri', fn: openMenu }]) },
    { label: 'Auto-strike: ' + (meta.auto ? 'On' : 'Off'), fn: () => { meta.auto = !meta.auto; saveMeta(); openMenu(); } },
    { label: 'Look speed: ' + ({ .6: 'Slow', 1: 'Normal', 1.6: 'Fast' }[meta.look] || 'Normal'), fn: () => { meta.look = meta.look === .6 ? 1 : meta.look === 1 ? 1.6 : .6; saveMeta(); openMenu(); } },
    { label: 'Sound: ' + (meta.sound ? 'On' : 'Off'), fn: () => { meta.sound = !meta.sound; saveMeta(); openMenu(); } },
    { label: 'How to play', fn: () => howTo(openMenu) },

}

  const c = CLASSES[S.cls], st = (a, b) => `<div class="stat"><span>${a}</span><span>${b}</span></div>`;

    st('Crit / Dodge', `${Math.round(S.crit * 100)}% / ${Math.round(S.dodge * 100)}%`) +
    st('Weapon', `${S.weapon.name} +${S.weapon.b}`) + st('Armor', `${S.armor.name} +${S.armor.b}`) +
    st('Tonics / Ethers', `${S.potions} / ${S.ethers}`) + st('Gold', S.gold) + st('Kills', S.kills) + st('Deepest floor', S.deepest || S.floor) + st('Time played', fmtTime(S.playMs)),
    [{ label: 'Back', cls: 'pri', fn: openMenu }]);

  const f = S.floor, P = { pot: 18 + f * 2, eth: 18 + f * 2, whet: 45 + f * 10, plate: 45 + f * 10 };
  const items = [
    ['pot', 'Red Tonic', 'Heals ~45% HP', () => S.potions++],
    ['eth', 'Blue Ether', 'Restores ~60% MP', () => S.ethers++],
    ['whet', 'Whetstone', '+1 weapon ATK', () => S.weapon.b++],
    ['plate', 'Rivet Kit', '+1 armor DEF', () => S.armor.b++],

  const card = modal('The Lantern Peddler', `<p>"Coin for comfort, friend. The deep takes the rest." <br>You have <b style="color:#e8c26a">${S.gold}</b> gold.</p>` +
    items.map(([k, n, d]) => `<div class="shop"><span>${n}<br><small style="color:#9a90a6">${d}</small></span><button class="btn pri" data-buy="${k}" ${S.gold < P[k] ? 'disabled' : ''}>${P[k]}g</button></div>`).join(''),
    [{ label: 'Leave', fn: () => { updateHUD(); save(); } }]);
  card.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const it = items.find(i => i[0] === b.dataset.buy); if (S.gold < P[it[0]]) return;

function howTo(back) {

  <p><b>Dodge:</b> monsters glow red right before they hit. Back off in time and they miss. A red flash on the edge of the screen shows which side a hit came from.</p>
  <p><b>🔥 Firebolt</b> (4 MP) flies straight ahead. <b>✚ Mend</b> (5 MP) heals. 🧪 Tonics heal, 💧 Ethers restore mana.</p>

// ================== TITLE ==================
function goTitle() {
  G.running = false; closeModal(); releaseInputs();
  const card = $('titleCard');
  let html = `<h1>LANTERNFALL</h1><div class="sub">a descent into the Hollow beneath Vellmoor</div>
  <p>The bells of Vellmoor ring backwards at night. Something below is calling. You take up a lantern and go down into the dark.</p>`;
  for (let i = 0; i < SLOTS; i++) {
    const s = readSlot(i);
    if (s) html += `<div class="slot"><div class="t">${s.name} the ${CLASSES[s.cls].name}${s.hp <= 0 ? ' <span style="color:#f88">(fallen)</span>' : ''}</div>
      <div class="m">Level ${s.lvl} · Floor ${s.floor} · ${s.gold} gold · ${fmtTime(s.playMs || 0)} played</div>
      <div class="row"><button class="btn pri" data-cont="${i}">${s.hp <= 0 ? 'Rise again' : 'Continue'}</button><button class="btn bad" data-del="${i}" style="flex:.45">Delete</button></div></div>`;
    else html += `<div class="slot"><div class="t" style="color:#9a90a6">Empty slot ${i + 1}</div><button class="btn" data-new="${i}">New adventurer</button></div>`;
  }
  html += `<div class="row" style="margin-top:6px"><button class="btn" id="tHow">How to play</button><button class="btn" id="tSnd">Sound: ${meta.sound ? 'On' : 'Off'}</button></div>`;
  if (meta.best) html += `<p style="text-align:center;color:#9a90a6;font-size:11px">Deepest floor reached: ${meta.best}</p>`;
  card.innerHTML = html;
  $('title').classList.add('show');
  card.querySelectorAll('[data-cont]').forEach(b => b.onclick = () => continueSlot(+b.dataset.cont));
  card.querySelectorAll('[data-new]').forEach(b => b.onclick = () => newGame(+b.dataset.new));
  card.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const i = +b.dataset.del, s = readSlot(i);
    modal('Delete save?', `<p>Delete ${s.name} the ${CLASSES[s.cls].name} (level ${s.lvl}, floor ${s.floor})? This cannot be undone.</p>`, [
      { label: 'Delete forever', cls: 'bad', fn: () => { localStorage.removeItem(SAVE_PREFIX + i); localStorage.removeItem(SAVE_PREFIX + i + '_cp'); cloudQueue('slot' + i, null); cloudQueue('slot' + i + '_cp', null); goTitle(); } },
      { label: 'Keep it', fn: () => { } }]);
  });
  $('tHow').onclick = () => howTo();
  $('tSnd').onclick = () => { meta.sound = !meta.sound; saveMeta(); goTitle(); };
}
function continueSlot(i) {

  const raw = localStorage.getItem(SAVE_PREFIX + i);
  S = deserialize(raw);
  if (S.hp <= 0) {
    const cp = localStorage.getItem(SAVE_PREFIX + i + '_cp');
    if (cp) { S = deserialize(cp); S.gold = Math.floor(S.gold * .75); S.log.push('You wake at the top of the stairs, shaking.'); }

  }

}

      Object.entries(CLASSES).map(([k, c]) => `<div class="cls ${k === sel ? 'sel' : ''}" data-cls="${k}"><b>${c.name}</b> <small style="color:#9a90a6">HP ${c.hp} · MP ${c.mp} · ATK ${c.atk + c.weapon.b}</small><div>${c.desc}</div></div>`).join(''),
      [{ label: 'Descend into the Hollow', cls: 'pri', fn: () => startNew(i, sel, ($('nName').value || name).trim().slice(0, 14)) }, { label: 'Cancel', fn: () => { } }]);
    card.querySelector('#nName').oninput = ev => name = ev.target.value;
    card.querySelectorAll('[data-cls]').forEach(el => el.onclick = () => { sel = el.dataset.cls; draw(); });

}
function startNew(i, cls, name) {
  slot = i; const c = CLASSES[cls];
  S = { v: SAVE_VERSION, name: name.replace(/[<>&"]/g, '') || 'Wanderer', cls, floor: 1, deepest: 1, lvl: 1, xp: 0, hp: c.hp, maxHp: c.hp, mp: c.mp, maxMp: c.mp, atk: c.atk, mag: c.mag, def: c.def, crit: c.crit, dodge: c.dodge,
    gold: 0, potions: 2, ethers: 1, weapon: { ...c.weapon }, armor: { ...c.armor }, kills: 0, turns: 0, playMs: 0, log: [] };
  enterFloor(true);
  S.log.push(`${S.name} lifts the lantern and steps into ${TIERS[0].name}.`, 'Find the glowing stairs. Menu ☰ has help.');

}

  closeModal(); $('title').classList.remove('show');
  resize(); enterFloor(false); updateHUD(); renderLog(); G.running = true; save(true);
}
