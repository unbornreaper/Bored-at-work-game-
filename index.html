<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lanternfall">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Lanternfall</title>
<style>
:root{--bg:#0b0a0f;--panel:#16131c;--edge:#2c2536;--gold:#e8c26a;--txt:#ece4d2;--dim:#9a90a6;--hp:#c8382e;--mp:#3a6fd8;--xp:#c9a23a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px);gap:6px;background:var(--bg)}
#view{position:relative;width:100%;aspect-ratio:16/10;background:#000;border:2px solid var(--edge);border-radius:8px;overflow:hidden;flex:none;touch-action:none}
#c{width:100%;height:100%;image-rendering:pixelated;display:block}
#mini{position:absolute;top:6px;right:6px;width:24%;height:auto;opacity:.9;border:1px solid #fff3;border-radius:4px;background:#000a;image-rendering:pixelated}
#mini.big{width:auto;height:94%;top:3%;right:50%;transform:translateX(50%);opacity:.95}
#floorTag{position:absolute;left:8px;top:6px;font-size:11px;color:#fff9;text-shadow:0 1px 2px #000;pointer-events:none}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash.go{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;top:42%;font-weight:bold;font-size:20px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:rise .9s ease-out forwards}
@keyframes rise{0%{transform:translateY(0) scale(1.3);opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:18px;color:var(--gold);text-shadow:0 2px 0 #000,0 0 10px #000;pointer-events:none;opacity:0;white-space:nowrap;text-align:center}
#toast.go{animation:toast 2.2s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
#hud{display:flex;flex-direction:column;gap:4px;flex:none}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.bar{position:relative;height:16px;background:#000;border:1px solid var(--edge);border-radius:4px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:50%;transition:width .2s}
.bar span{position:relative;display:block;text-align:center;font-size:11px;line-height:15px;text-shadow:0 1px 1px #000}
.bar.hp i{background:linear-gradient(#e0574b,#8f1f18)}.bar.mp i{background:linear-gradient(#5b8cf0,#22408e)}
.bar.xp{grid-column:1/3;height:7px}.bar.xp i{background:var(--xp)}
.info{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:0 2px}
.info b{color:var(--gold);font-weight:normal}
#log{flex:none;height:62px;overflow:hidden;font-size:12px;line-height:15px;background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:3px 7px;display:flex;flex-direction:column;justify-content:flex-end}
#log div{opacity:.45}#log div:nth-last-child(1){opacity:1}#log div:nth-last-child(2){opacity:.8}#log div:nth-last-child(3){opacity:.6}
#controls{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}
#pad,#acts{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(52px,84px));gap:6px;min-height:0;align-content:end}
#controls button{background:linear-gradient(#231e2b,#17131d);border:1px solid #3a3146;border-radius:10px;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:0;touch-action:none}
#controls button small{font-size:10px;color:var(--dim);margin-top:2px}
#controls button.on{background:#3a3146;transform:scale(.96)}
#controls button.atk{border-color:#7a3a2e;background:linear-gradient(#3a1d18,#1d0f0c)}
.screen,#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(#1a1422,#050407);z-index:10;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);overflow:auto}
#modal{background:#000b;z-index:20}
.show{display:flex!important}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:16px;box-shadow:0 10px 40px #000;max-height:100%;overflow:auto}
.card h2{margin:0 0 8px;color:var(--gold);font-size:18px;letter-spacing:1px}
.card p{margin:6px 0;font-size:13px;line-height:1.45;color:#cfc6d8}
.btn{display:block;width:100%;margin-top:8px;padding:12px;border-radius:9px;border:1px solid #4a3f58;background:linear-gradient(#2b2435,#1c1723);font-size:15px;cursor:pointer}
.btn.pri{border-color:#9b7a35;background:linear-gradient(#4a3a1c,#2a200e);color:#ffe6a8}
.btn.bad{border-color:#7a2e2e;color:#ffb3a8}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}.row .btn{flex:1}
h1{font-size:34px;letter-spacing:4px;margin:0;color:var(--gold);text-align:center;text-shadow:0 0 18px #e8c26a55}
.sub{text-align:center;color:var(--dim);font-size:12px;margin:4px 0 14px}
.slot{border:1px solid var(--edge);border-radius:10px;padding:10px;margin-top:10px;background:#0f0d13}
.slot .t{font-size:14px}.slot .m{font-size:11px;color:var(--dim);margin-top:3px}
.cls{border:1px solid var(--edge);border-radius:10px;padding:10px;margin-top:8px;cursor:pointer;background:#0f0d13}
.cls.sel{border-color:var(--gold);background:#221b10}
.cls b{color:var(--gold)}.cls div{font-size:12px;color:#cfc6d8;margin-top:3px}
input{width:100%;padding:11px;border-radius:8px;border:1px solid #4a3f58;background:#0b0a0f;color:var(--txt);font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed #2c2536}
.stat span:last-child{color:var(--gold)}
.shop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.shop .btn{width:auto;margin:0;padding:8px 12px;font-size:13px}
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:none;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1fr auto auto;grid-template-areas:"pad view acts" "pad hud acts" "pad log acts";padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));column-gap:10px}
  #view{grid-area:view;height:100%;width:auto;min-height:0;justify-self:center}
  #hud{grid-area:hud;width:100%}
  #log{grid-area:log;height:48px}
  #controls{display:contents}
  #pad{grid-area:pad;align-self:end;height:62%;grid-template-rows:repeat(2,1fr)}
  #acts{grid-area:acts;align-self:end;height:62%;grid-template-rows:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="c"></canvas>
    <canvas id="mini"></canvas>
    <div id="floorTag"></div>
    <div id="flash"></div>
    <div id="floats"></div>
    <div id="toast"></div>
  </div>
  <div id="hud">
    <div class="bars">
      <div class="bar hp"><i id="bHp"></i><span id="tHp"></span></div>
      <div class="bar mp"><i id="bMp"></i><span id="tMp"></span></div>
      <div class="bar xp"><i id="bXp"></i></div>
    </div>
    <div class="info"><span id="iLvl"></span><span id="iGear"></span><span>Gold <b id="iGold"></b></span></div>
  </div>
  <div id="log"></div>
  <div id="controls">
    <div id="pad">
      <button data-a="tl">⟲<small>Turn</small></button>
      <button data-a="fwd">▲<small>Walk</small></button>
      <button data-a="tr">⟳<small>Turn</small></button>
      <button data-a="sl">◀<small>Step</small></button>
      <button data-a="back">▼<small>Back</small></button>
      <button data-a="sr">▶<small>Step</small></button>
    </div>
    <div id="acts">
      <button data-a="atk" class="atk">⚔<small>Strike</small></button>
      <button data-a="bolt">🔥<small>Bolt·4</small></button>
      <button data-a="mend">✚<small>Mend·5</small></button>
      <button data-a="potion">🧪<small id="nPot">×0</small></button>
      <button data-a="ether">💧<small id="nEth">×0</small></button>
      <button data-a="menu">☰<small>Menu</small></button>
    </div>
  </div>
</div>

<div id="title" class="screen"><div class="card" id="titleCard"></div></div>
<div id="modal"><div class="card" id="modalCard"></div></div>

<script>
'use strict';
// ================== CORE CONSTANTS ==================
const W = 320, H = 200, TEX = 32;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const SAVE_PREFIX = 'lanternfall_slot_', META_KEY = 'lanternfall_meta', SLOTS = 3;
const $ = id => document.getElementById(id);
const cv = $('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

const mini = $('mini'), mctx = mini.getContext('2d');

const RGB = (r, g, b) => (0xff000000 | (b << 16) | (g << 8) | r) >>> 0;

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ================== GAME DATA ==================
const CLASSES = {
  sellsword: { name: 'Sellsword', desc: 'Heavy steel, thick hide. Hits hard and shrugs off blows. Easiest start.', hp: 34, mp: 6, atk: 6, mag: 1, def: 3, crit: .06, dodge: .05,
    weapon: { name: 'Notched Blade', b: 2 }, armor: { name: 'Boiled Leather', b: 1 }, g: { hp: 6, mp: 1, atk: 1, mag: .2, def: .5, crit: 0 }, regenHp: 6, regenMp: 9, hand: 'sword' },
  ashbinder: { name: 'Ashbinder', desc: 'Fragile scholar of ember-craft. Firebolts melt the dark, Mend keeps you breathing.', hp: 22, mp: 20, atk: 3, mag: 6, def: 1, crit: .05, dodge: .07,

  wisp: { name: 'Ember Wisp', hp: 9, atk: 6, def: 0, xp: 10, speed: 1.5, minF: 4, dodge: .25, bright: true, verb: 'sears' },
  knight: { name: 'Gloam Warden', hp: 55, atk: 8, def: 4, xp: 60, speed: 1, minF: 999, boss: true, verb: 'cleaves', scale: 1.2 },
};
const TIERS = [
  { name: 'The Ossuary', wall: [150, 118, 86], mortar: [58, 46, 36], floor: [92, 80, 68], ceil: [46, 38, 32], accent: 'moss', fog: [10, 8, 6] },
  { name: 'The Drowned Vaults', wall: [78, 98, 112], mortar: [30, 40, 48], floor: [58, 70, 76], ceil: [28, 36, 44], accent: 'crystal', fog: [3, 8, 13] },
  { name: 'The Ember Halls', wall: [62, 46, 48], mortar: [26, 16, 18], floor: [66, 46, 40], ceil: [30, 18, 18], accent: 'lava', fog: [16, 5, 2] },
  { name: 'The Pale Below', wall: [168, 164, 178], mortar: [78, 72, 92], floor: [108, 102, 122], ceil: [48, 42, 60], accent: 'rune', fog: [8, 6, 16] },
];
const PREFIX = ['Rusted', 'Iron', 'Etched', 'Grim', 'Moonlit', 'Bloodsilver', 'Starless', 'Hollowforged', 'Kingslayer'];
const WBASE = { sellsword: ['Blade', 'Axe', 'Mace', 'Greatsword'], ashbinder: ['Staff', 'Rod', 'Sceptre', 'Wand'], cutpurse: ['Knives', 'Dirk', 'Stiletto', 'Kris'] };
const ABASE = ['Jerkin', 'Mail', 'Cuirass', 'Cloak', 'Brigandine', 'Plate'];
const NAMES = ['Vesk', 'Maren', 'Oda', 'Thorne', 'Ilsa', 'Corvin', 'Bram', 'Sable', 'Wren', 'Holt', 'Isolde', 'Fenn'];
const tierOf = f => Math.floor((f - 1) / 4) % TIERS.length;
const xpNeed = l => 12 + l * l * 8;

// ================== SPRITES (16x16 pixel art) ==================
const PAL = { k: [15, 12, 15], w: [228, 222, 200], W: [150, 145, 135], r: [230, 40, 30], R: [120, 20, 20], g: [96, 196, 74], G: [40, 110, 40], b: [130, 85, 45], B: [80, 50, 25], D: [58, 34, 16],
  y: [255, 214, 70], o: [250, 130, 30], p: [112, 52, 144], P: [60, 26, 82], s: [222, 172, 132], c: [90, 225, 235], C: [30, 90, 150], a: [128, 134, 150], A: [66, 70, 84], m: [96, 20, 30], t: [210, 130, 130], h: [92, 88, 70], n: [235, 190, 50], v: [190, 120, 255] };
const SPR_SRC = {
  gnawer: ['', '', '', '', '', '..BB........BB..', '.BtBB......BBtB.', '.BBbbbbbbbbbbBB.', '..bbbbbbbbbbbb..', '..bbrrbbbbrrbb..', '..bbrkbbbbrkbb..', '...bbbbbbbbbb...', '...bbbbttbbbb...', '....bwbkkbwb....', '.....bbbbbb.....', '......BBBB......'],
  slime: ['', '', '', '', '', '......gggg......', '....gggggggg....', '...gggggggggg...', '..ggwkggggwkgg..', '..ggkkggggkkgg..', '.gggggggggggggg.', '.gggggmmmmggggg.', '.ggggggmmgggggg.', 'gggggggggggggggg', '.GGGGGGGGGGGGGG.', ''],
  wretch: ['.....wwwwww.....', '....wwwwwwww....', '....wkkwwkkw....', '....wkrwwkrw....', '....wwwkkwww....', '.....wkwkww.....', '......wwww......', '...wwwwwwwwww...', '..w..wkwwkw..w..', '..w..wwwwww..w..', '..W..wkwwkw..W..', '.....wwwwww.....', '......w..w......', '......w..w......', '.....ww..ww.....', '....www..www....'],
  cultist: ['......pppp......', '.....pppppp.....', '....pppppppp....', '....ppkkkkpp....', '....pkykkykp....', '....ppkkkkpp....', '...pppppppppp...', '..pppppPPppppp..', '..pp.ppPPppp.pp.', '..s..ppPPppp..s.', '.....ppPPppp....', '.....ppppppp....', '....ppppppppp...', '....ppppppppp...', '...ppppppppppp..', '...PPPPPPPPPPP..'],
  wisp: ['', '', '.......oo.......', '......oyyo......', '.....oyyyyo.....', '....oyywwyyo....', '...oyywwwwyyo...', '...oywkwwkwyo...', '...oywwwwwwyo...', '...oyywmmwyyo...', '....oyywwyyo....', '.....oyyyyo.....', '......oyyo......', '.......oo.......', '', ''],
  knight: ['.....aaaaaa.....', '....aaaaaaaa....', '....akkkkkka....', '....akrkkrka....', '....aaaaaaaa....', '.....aaaaaa.....', '..aaaaaaaaaaaa..', '.aaaAaaaaaaAaaa.', '.aa.aaaaaaaa.aa.', '.aa.aaAAAAaa.aa.', '.ss.aaaaaaaa.ss.', '.W..aaaaaaaa..W.', '.W..aaa..aaa..W.', '.W..aaa..aaa..W.', '....aaa..aaa....', '...AAAA..AAAA...'],
  chest: ['', '', '', '', '', '', '', '...DDDDDDDDDD...', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DDDDDnnDDDDD..', '..DbbbbnnbbbbD..', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DDDDDDDDDDDD..', ''],
  chestOpen: ['', '', '', '', '...DDDDDDDDDD...', '..DbbbbbbbbbbD..', '..DDDDDDDDDDDD..', '..DkkkkkkkkkkD..', '..DDDDDDDDDDDD..', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DbbbbbbbbbbD..', '..DDDDDDDDDDDD..', ''],
  stairs: ['', '', '', '', '.......c........', '......ccc.......', '.....ccccc......', '.......c........', '.......c........', '', '', '...cccccccccc...', '..ckkkkkkkkkkc..', '.ckkkkkkkkkkkkc.', '..ckkkkkkkkkkc..', '...cccccccccc...'],
  shrine: ['.......c........', '......cwc.......', '.......c........', '', '......ccc.......', '.....ccwcc......', '......ccc.......', '', '.....WWWWWW.....', '....WccccccW....', '....WWWWWWWW....', '......WWWW......', '......WWWW......', '......WWWW......', '....WWWWWWWW....', '...WWWWWWWWWW...'],
  peddler: ['.....hhhhhh.....', '....hhhhhhhh....', '...hhkkkkkkhh...', '...hkkykkykkh...', '...hkkkkkkkkh...', '...hhkkwwkkhh...', '....hhhhhhhh....', '..hhhhhhhhhhhh..', '.hhhhbbbbhhhhhy.', '.hhh.bnnb.hhhoyo', '.ss..bbbb..ss.y.', '....hhhhhhhh....', '....hhhhhhhh....', '...hhhhhhhhhh...', '...hhhhhhhhhh...', '..BBBB....BBBB..'],
  fire: ['', '', '', '', '', '......oooo......', '.....oyyyyo.....', '....oyywwyyo....', '....oywwwwyo....', '....oyywwyyo....', '.....oyyyyo.....', '......oooo......', '', '', '', ''],
  hex: ['', '', '', '', '', '......PPPP......', '.....PvvvvP.....', '....PvvwwvvP....', '....PvwwwwvP....', '....PvvwwvvP....', '.....PvvvvP.....', '......PPPP......', '', '', '', ''],
};
const SPR = {};
for (const k in SPR_SRC) {
  const s = new Uint32Array(256), rows = SPR_SRC[k];
  for (let y = 0; y < 16; y++) { const r = (rows[y] || '').padEnd(16, '.'); for (let x = 0; x < 16; x++) { const p = PAL[r[x]]; s[y * 16 + x] = p ? RGB(p[0], p[1], p[2]) : 0; } }
  SPR[k] = s;
}

// ================== TEXTURES ==================
let TX = null;
function makeTex(fn) { const px = new Uint32Array(TEX * TEX), em = new Uint8Array(TEX * TEX); for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) { const v = fn(x, y); if (Array.isArray(v)) { px[y * TEX + x] = v[0]; em[y * TEX + x] = 1; } else px[y * TEX + x] = v; } return { px, em }; }
function genTextures(tier, s) {
  const T = TIERS[tier];
  const brick = (x, y) => { const row = y >> 3, off = (row & 1) ? 8 : 0, col = (x + off) >> 4, bx = (x + off) & 15, by = y & 7, n = hash2(x, y, s) * 18 - 9;
    if (by === 0 || bx === 0) return { mortar: true, c: C(T.mortar[0] + n, T.mortar[1] + n, T.mortar[2] + n) };
    const bt = hash2(col, row, s + 7) * 30 - 15; let e = 0; if (by === 1 || bx === 1) e = 14; if (by === 7 || bx === 15) e = -14;
    return { c: C(T.wall[0] + bt + n + e, T.wall[1] + bt + n + e, T.wall[2] + bt + n + e) }; };
  const wallA = makeTex((x, y) => brick(x, y).c);
  const wallB = makeTex((x, y) => {
    const b = brick(x, y), r = hash2(x, y, s + 11);
    if (T.accent === 'moss') { if (hash2(x >> 1, y >> 1, s + 3) < 0.15 + (y / TEX) * 0.5) return C(50 + r * 40, 100 + r * 50, 30 + r * 20); return b.c; }
    if (T.accent === 'lava') { if (b.mortar) return [C(230, 90 + r * 70, 20)]; return b.c; }
    if (T.accent === 'crystal') { for (const [cx, hh, ww] of [[8, 18, 3], [16, 26, 4], [24, 14, 3]]) { const t = (31 - y) / hh; if (t <= 1 && Math.abs(x - cx) < ww * (1 - t) + 0.5) return [C(80 + t * 120, 200 + t * 50, 230)]; } return b.c; }
    if (T.accent === 'rune') { const d = Math.hypot(x - 15.5, y - 15.5); if ((d > 8 && d < 9.6) || (Math.abs(x - 15.5) < 1 && d < 8) || (Math.abs(y - 12) < 1 && Math.abs(x - 15.5) < 5)) return [C(190, 120, 255)]; return b.c; }

  if (S.turns % c.regenMp === 0 && S.mp < S.maxMp) S.mp++;
  for (const e of enemies()) {
    e.energy += ENEMIES[e.k].speed;
    while (e.energy >= 1 && S.hp > 0 && S.ents.includes(e)) { e.energy -= 1; enemyStep(e); }
  }

}

}

// ================== RENDERING ==================
let FR = 0, FG = 0, FB = 0;

const light = d => { let l = 1 - d / LR; if (l <= 0) return 0.02; return Math.min(1, l * l * 1.35 + .02); };

function render(now) {

  [FR, FG, FB] = TX.fog;

    if (rdx < 0) { stepX = -1; sdx = (cx - mx) * ddx; } else { stepX = 1; sdx = (mx + 1 - cx) * ddx; }
    if (rdy < 0) { stepY = -1; sdy = (cy - my) * ddy; } else { stepY = 1; sdy = (my + 1 - cy) * ddy; }
    for (let i = 0; i < 64; i++) {
      if (sdx < sdy) { sdx += ddx; mx += stepX; side = 0; } else { sdy += ddy; my += stepY; side = 1; }
      if (mx < 0 || my < 0 || mx >= mapW || my >= S.h) { hit = 1; break; }
      hit = map[my * mapW + mx]; if (hit) break;
    }
    const perp = Math.max(.0001, side === 0 ? sdx - ddx : sdy - ddy);
    zbuf[x] = perp;
    const lh = H / perp; let ds = Math.floor(-lh / 2 + half), de = Math.floor(lh / 2 + half);
    let wx = side === 0 ? cy + perp * rdy : cx + perp * rdx; wx -= Math.floor(wx);
    let tx = Math.floor(wx * TEX); if (side === 0 && rdx > 0) tx = TEX - tx - 1; if (side === 1 && rdy < 0) tx = TEX - tx - 1;
    const tex = TX.walls[hit] || TX.walls[1], step = TEX / lh;
    let tp = (Math.max(0, ds) - half + lh / 2) * step;

    list.push({ e, spr, x: e.rx, y: e.ry, bright: e.t === 'stairs' || e.t === 'shrine' || (e.t === 'enemy' && ENEMIES[e.k].bright), scale: e.t === 'enemy' ? (ENEMIES[e.k].scale || 1) : 1, sy: 1 });
  }
  for (const c of G.corpses) list.push({ spr: c.k, x: c.rx, y: c.ry, scale: ENEMIES[c.k].scale || 1, sy: c.life, fade: true });
  for (const f of G.fx) { const t = Math.min(1, f.t / f.dur); list.push({ spr: f.spr, x: f.x0 + (f.x1 - f.x0) * t, y: f.y0 + (f.y1 - f.y0) * t, bright: true, scale: 1, sy: 1 }); }

  list.sort((a, b) => b.d - a.d);

      const txp = Math.min(15, Math.floor((x - (scrX - sh2 / 2)) * 16 / sh2));

        const c = tex[typ * 16 + txp]; if (!c) continue;
        buf[y * W + x] = fl ? 0xffffffff : sh(c, s.fade ? l * s.sy : l);
      }
    }

}
function drawHand(now) {
  const kind = CLASSES[S.cls].hand, ph = G.swing > 0 ? Math.sin((1 - G.swing) * Math.PI) : 0, bob = Math.sin(G.walk) * 3;
  ctx.save();

    ctx.fillStyle = '#4a2e18'; ctx.fillRect(-4, -96, 8, 130); ctx.fillStyle = '#6b4424'; ctx.fillRect(-2, -96, 3, 130);

function drawMini() {

  for (let y = 0; y < S.h; y++) for (let x = 0; x < S.w; x++) {
    if (!S.seen[idx(x, y)]) continue;

  for (const e of S.ents) {

    if (e.t === 'enemy' && !(Math.abs(e.x - S.px) + Math.abs(e.y - S.py) <= 6 && los(S.px, S.py, e.x, e.y))) continue;
    mctx.fillStyle = { stairs: '#5be1eb', chest: e.open ? '#6a5a3a' : '#e8c26a', shrine: '#4aa8ff', peddler: '#7f7', enemy: ENEMIES[e.k] && ENEMIES[e.k].boss ? '#ff0' : '#f44' }[e.t];
    mctx.fillRect(e.x * s, e.y * s, s, s);

// ================== MAIN LOOP ==================
function frame(now) {

  const dt = Math.min(.05, (now - (G.last || now)) / 1000); G.last = now;
  if (!G.running || !S || !TX) return;

  const moving = Math.abs(cam.x - tx) + Math.abs(cam.y - ty) > .02;

  for (const e of S.ents) { if (e.rx === undefined) { e.rx = e.x + .5; e.ry = e.y + .5; } e.rx += (e.x + .5 - e.rx) * k; e.ry += (e.y + .5 - e.ry) * k; if (e.flash > 0) e.flash -= dt * 1000; }
  for (const c of G.corpses) c.life -= dt * 2.5; G.corpses = G.corpses.filter(c => c.life > 0);
  for (const f of G.fx) f.t += dt; G.fx = G.fx.filter(f => f.t < f.dur + .05);

requestAnimationFrame(frame);

const REPEAT = { fwd: 240, back: 240, sl: 240, sr: 240, tl: 330, tr: 330 };

});

  ' ': 'atk', f: 'atk', F: 'atk', '1': 'bolt', '2': 'mend', '3': 'potion', h: 'potion', '4': 'ether', m: 'map', M: 'map', Escape: 'menu' };
